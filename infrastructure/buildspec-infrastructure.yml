version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
  pre_build:
    commands:
      - echo Installing CDK dependencies...
      - npm ci
  build:
    commands:
      - echo Build started on `date`
      - echo Building CDK application...
      - npm run build
      - echo Synthesizing CDK templates...
      - npx cdk synth
      - echo Build completed on `date`